<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1116" />
  <title>Verkeerslicht</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="state-unknown">
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Verkeerslicht</span>
    </div>
    <div id="mode" class="mode">…</div>
  </header>

  <main class="hero">
    <div class="light" aria-label="verkeerslicht">
      <div id="red"   class="lamp red"></div>
      <div id="amber" class="lamp amber"></div>
      <div id="green" class="lamp green"></div>
    </div>

    <div class="countdown-block">
      <div class="countdown-label" id="next-label">wachten op data</div>
      <div class="countdown" id="countdown">--</div>
      <div class="countdown-unit">seconden</div>
    </div>
  </main>

  <section class="card">
    <div class="card-row">
      <label class="field">
        <span>Kruising</span>
        <input id="ix" type="number" value="9999" inputmode="numeric" />
      </label>
      <label class="field">
        <span>Signaalgroep</span>
        <input id="sg" type="number" value="1" inputmode="numeric" />
      </label>
    </div>
    <div class="phase-row">
      <span class="phase-label">Fase</span>
      <span id="phase" class="phase-value">–</span>
    </div>
    <div class="phase-row">
      <span class="phase-label">Bron</span>
      <span id="meta" class="phase-value muted">–</span>
    </div>
  </section>

  <details class="settings">
    <summary>Geavanceerd</summary>
    <div class="card-row">
      <label class="field grow">
        <span>API-URL (leeg = browser-demo)</span>
        <input id="api-base" type="url" placeholder="https://mijn-server.fly.dev" />
      </label>
      <button id="api-save" type="button" class="btn">Opslaan</button>
    </div>
    <p class="hint">
      Op GitHub Pages draait alleen de browser-demo. Voor live UDAP-data
      heb je een eigen backend nodig (zie de
      <a href="https://github.com/idkmanLool9/Verkeerslicht">README</a>).
    </p>
  </details>

  <footer class="foot">
    SPaT-formaat: SAE J2735 / ISO TS 19091 via NDW Talking Traffic / UDAP.
  </footer>

  <script src="./app.js"></script>
</body>
</html>
