<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e14" />
  <title>Verkeerslicht — slimme stoplichten op je route</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="map" class="map"></div>

  <!-- Sidebar (links-boven) -->
  <aside class="sidebar">
    <header class="sidebar-head">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Verkeerslicht</span>
      </div>
      <div id="mode" class="mode">demo</div>
    </header>

    <div class="search-box">
      <div class="search-row">
        <span class="pin from" aria-hidden="true"></span>
        <input id="from" class="search-input" type="text" placeholder="Vertrekpunt" autocomplete="off" />
        <button class="locate-btn" id="locate" title="Mijn locatie" aria-label="Mijn locatie">⊙</button>
      </div>
      <div class="search-row">
        <span class="pin to" aria-hidden="true"></span>
        <input id="to" class="search-input" type="text" placeholder="Bestemming" autocomplete="off" />
        <button class="swap-btn" id="swap" title="Wisselen" aria-label="Wisselen">⇅</button>
      </div>
      <button id="plan" class="btn btn-primary btn-block">
        <span class="btn-icon">▶</span> Plan rit
      </button>
    </div>

    <div id="routes-list" class="routes-list hidden">
      <div class="routes-title">routes</div>
      <!-- gevuld in JS -->
    </div>

    <div class="legend">
      <div class="legend-title">stoplichten</div>
      <div class="legend-row">
        <span class="legend-dot smart green"></span><span>slim — live status &amp; aftelling</span>
      </div>
      <div class="legend-row">
        <span class="legend-dot classic"></span><span>klassiek — locatie bekend, geen timer</span>
      </div>
    </div>
  </aside>

  <!-- Bottom sheet (verschijnt na route-keuze) -->
  <section id="sheet" class="sheet hidden" aria-hidden="true">
    <div class="sheet-handle"></div>

    <div class="sheet-eta">
      <div>
        <div class="eta-label">aankomst</div>
        <div id="eta-time" class="eta-time">--:--</div>
      </div>
      <div class="eta-meta">
        <div><span id="eta-duration">–</span> · <span id="eta-distance">– km</span></div>
        <div>
          <span id="eta-signals">0</span> stoplichten ·
          <span id="eta-smart">0</span> slim
        </div>
      </div>
      <button id="drive-toggle" class="btn btn-primary btn-compact">Start rit</button>
    </div>

    <div class="next-light" id="next-light">
      <div class="lamp-mini">
        <div id="mini-red"   class="lamp-dot red"></div>
        <div id="mini-amber" class="lamp-dot amber"></div>
        <div id="mini-green" class="lamp-dot green"></div>
      </div>
      <div class="next-info">
        <div class="next-label">volgend stoplicht</div>
        <div class="next-distance"><span id="next-distance">–</span></div>
        <div class="next-phase"><span id="next-phase">geen lichten</span></div>
      </div>
      <div class="next-countdown">
        <div id="next-countdown">--</div>
        <div class="next-countdown-unit">s</div>
      </div>
    </div>

    <div class="upcoming">
      <div class="upcoming-title">verderop</div>
      <ol id="upcoming-list" class="upcoming-list"></ol>
    </div>
  </section>

  <!-- Loading overlay -->
  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
    <div id="loading-text">Route plannen…</div>
  </div>

  <!-- Toast / errors -->
  <div id="toast" class="toast hidden"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script src="./app.js"></script>
</body>
</html>
